name: Resolve Discord link
description: >-
  Resolve a GitHub user's Discord account through Arbiterer using GitHub OIDC. The calling job needs the
  `id-token: write` permission. Note: for pull requests from forks, the workflow must use `on: pull_request_target`.

inputs:
  close-on-failure:
    description: Close the pull request when the author has not linked their accounts or fails the rules, and
      open it again once they pass. Requires the workflow to also trigger on `reopened`.
    required: false
    default: "false"
  comment-on-linked:
    description: Comment on the pull request when the author is already linked. Set to false to comment only
      while the author still needs to link. An earlier request to link is always updated once they do.
    required: false
    default: "true"
  rules:
    description: >-
      Optional JavaScript that decides whether the author passes. It can read `user` (their linked Discord
      account) and call `resolveMember(guildId)` to get their member record in a server, or null if they
      aren't a member. Call `core.setFailed` to reject. Leave empty to require only a linked account.
    required: false
    default: ""

outputs:
  status:
    description: Link status of the pull request author (`unlinked`, `github_verified`, `linked` or `revoked`).
    value: ${{ steps.request.outputs.status }}
  link-url:
    description: URL where the author can link or re-link their accounts. Empty when already linked.
    value: ${{ steps.request.outputs.link-url }}
  user:
    description: The author's Discord user object as JSON when linked, otherwise empty.
    value: ${{ steps.request.outputs.user }}

runs:
  using: composite
  steps:
    - id: request
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        ARBITERER_ACTION_PATH: ${{ github.action_path }}
        ARBITERER_CLOSE_ON_FAILURE: ${{ inputs.close-on-failure }}
        ARBITERER_COMMENT_ON_LINKED: ${{ inputs.comment-on-linked }}
        ARBITERER_RULES: ${{ inputs.rules }}
      with:
        script: |
          const path = require('path');
          const resolve = require(path.join(process.env.ARBITERER_ACTION_PATH, 'scripts', 'resolve.js'));
          await resolve({ core, context, github });
