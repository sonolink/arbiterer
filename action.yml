name: Resolve Discord link
description: >-
  Resolve a GitHub user's Discord account through Arbiterer using GitHub OIDC. The calling job needs the
  `id-token: write` permission. Note: for pull requests from forks, the workflow must use `on: pull_request_target`.
inputs:
  close-on-failure:
    description: Close the pull request when the rules script fails it, or when the author has not linked
      their accounts. Set to false to leave the pull request open with a failing check.
    required: false
    default: "false"
  comment-on-linked:
    description: Post a comment on the pull request confirming that the author is already linked. Set to false to only
      comment when the author still has to act. A comment that earlier asked them to act is always updated.
    required: false
    default: "true"
  rules:
    description: >-
      Optional JavaScript that decides whether the pull request author passes. It runs with `user`, the
      author's linked Discord account, and `resolveMember(guildId)`, which resolves the author's member
      record or null. Call core.setFailed to reject. Leave empty to require only a linked Discord account.
    required: false
    default: ""
outputs:
  status:
    description: Account link status returned by Arbiterer.
    value: ${{ steps.request.outputs.status }}
  link-url:
    description: URL for linking or re-linking an account.
    value: ${{ steps.request.outputs.link-url }}
  user:
    description: Raw Discord user object if the author has linked their account, otherwise null.
    value: ${{ steps.request.outputs.user }}

runs:
  using: composite
  steps:
    - id: request
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        ARBITERER_ACTION_PATH: ${{ github.action_path }}
        ARBITERER_CLOSE_ON_FAILURE: ${{ inputs.close-on-failure }}
        ARBITERER_COMMENT_ON_LINKED: ${{ inputs.comment-on-linked }}
        ARBITERER_RULES: ${{ inputs.rules }}
      with:
        script: |
          const path = require('path');
          const resolve = require(path.join(process.env.ARBITERER_ACTION_PATH, 'scripts', 'resolve.js'));
          await resolve({ core, context, github });
