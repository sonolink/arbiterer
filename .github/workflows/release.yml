name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      latest: ${{ steps.version.outputs.latest }}
      latest_in_major: ${{ steps.version.outputs.latest_in_major }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check branch
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi

      - name: Check version matches tag
        run: |
          want=${GITHUB_REF_NAME#v}
          got=$(sed -nE 's/^const Version = "([^"]+)"$/\1/p' internal/version/version.go)
          if [ "$got" != "$want" ]; then
            echo "::error::internal/version/version.go has version '$got', but the tag is '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Check unreleased changelog entry
        run: sh .github/scripts/changelog-extract.sh

      - name: Classify which tags to move
        id: version
        run: |
          releases=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          major=${GITHUB_REF_NAME%%.*}
          is() { [ "$GITHUB_REF_NAME" = "$1" ] && echo true || echo false; }
          echo "latest=$(is "$(echo "$releases" | tail -n 1)")" >> "$GITHUB_OUTPUT"
          echo "latest_in_major=$(is "$(echo "$releases" | grep "^$major\." | tail -n 1)")" >> "$GITHUB_OUTPUT"

  image:
    name: Image
    needs: [prepare]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote-image.yml
    with:
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}},enable=${{ needs.prepare.outputs.latest_in_major }}
        type=raw,value=latest,enable=${{ needs.prepare.outputs.latest }}

  deploy:
    name: Deploy
    needs: [image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}

  publish:
    name: Publish
    needs: [prepare, deploy]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          sh .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --latest="$LATEST"

      - name: Move tag
        if: needs.prepare.outputs.latest_in_major == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          major=${GITHUB_REF_NAME%%.*}
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
          fi

  bump-version:
    permissions:
      contents: read
    name: Bump version for development
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.release.target_commitish || github.event.repository.default_branch }}

      - name: Run bump script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const path = require('path');
            const script = require(path.resolve('.github/scripts/bump-version.js'));
            await script({ core, context });

      - name: Get GitHub App user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit and push version changes
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "chore(version): bump version to ${NEW_VERSION} [skip ci]"
          git pull --rebase
          git push
