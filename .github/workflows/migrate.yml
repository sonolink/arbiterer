name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose database to migrate
        required: true
        type: choice
        options:
          - alpha
          - production
      image:
        description: Image to migrate at, defaults to the one already deployed
        required: false
        type: string

permissions: {}

jobs:
  preflight:
    name: Preflight
    permissions:
      contents: read
    uses: ./.github/workflows/preflight.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}

  migrate:
    name: Migrate
    needs: [preflight]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    # Shared with deploy so that a migration and a deploy of the same
    # environment cannot reach the host at the same time.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Upload compose and migrate script
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: deploy/compose.yml,deploy/migrate.sh
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Migrate
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,IMAGE,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -eu
            printf '%s' "$GHCR_TOKEN" | docker --config "$DEPLOY_PATH/.docker" login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            sh "$DEPLOY_PATH/migrate.sh" "$DEPLOY_PATH" "$IMAGE"
