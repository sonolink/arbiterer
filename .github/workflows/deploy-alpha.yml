name: Deploy alpha

on:
  workflow_dispatch:
  push:
    branches: [alpha]

permissions: {}

jobs:
  preflight:
    name: Preflight
    permissions:
      contents: read
    uses: ./.github/workflows/preflight.yml
    secrets: inherit
    with:
      environment: alpha

  lint:
    name: Lint
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  image:
    name: Image
    needs: [preflight, lint, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: |
        type=sha,format=long
        type=raw,value=alpha

  deploy:
    name: Deploy
    needs: [image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
    with:
      environment: alpha
      image: ${{ needs.image.outputs.image }}
