name: Deploy alpha

on:
  workflow_dispatch:
  push:
    branches: [alpha]

permissions: {}

# Alpha is continuously deployed from every push to the alpha branch.
# lint.yml and test.yml do not trigger on pushes to alpha themselves (only on PRs
# and main), so calling them here runs each exactly once per alpha push, and
# nothing is deployed unless both pass. Calling them via workflow_call (instead of
# a workflow_run trigger) makes the image/deploy jobs wait on them directly.
jobs:
  preflight:
    name: Preflight
    permissions:
      contents: read
    uses: ./.github/workflows/preflight.yml
    secrets: inherit
    with:
      environment: alpha

  lint:
    name: Lint
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    needs: [preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  image:
    name: Image
    needs: [preflight, lint, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: |
        type=sha,format=long
        type=raw,value=alpha

  deploy:
    name: Deploy
    needs: [image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: alpha
      image: ${{ needs.image.outputs.image }}
