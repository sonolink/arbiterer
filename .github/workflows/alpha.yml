name: Deploy to alpha

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "PRIVACY.md"
      - "TERMS.md"
      - "LICENSE"
      - "docs/**"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".github/renovate.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/assets/**"
      - ".env.example"
      - "compose.yml"
      - "secrets/*.example.txt"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"

permissions: {}

concurrency:
  group: alpha
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  image:
    name: Image
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: |
        type=sha,format=long
        type=raw,value=alpha

  deploy:
    name: Deploy
    needs: [image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: alpha
      image: ${{ needs.image.outputs.image }}
      migrate: true
