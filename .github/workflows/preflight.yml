name: Preflight

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions: {}

jobs:
  secrets:
    name: Deploy secrets
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - name: Check secrets
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          LOGIN: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$FINGERPRINT" ] || [ -z "$HOST" ] || [ -z "$LOGIN" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_HOST_FINGERPRINT, DEPLOY_HOST, DEPLOY_USER or DEPLOY_PATH is not set for the ${{ inputs.environment }} environment"
            exit 1
          fi
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "::error::DEPLOY_PATH must be an absolute path"; exit 1 ;;
          esac

      # appleboy verifies the fingerprint when it connects. This runs first so
      # that a key changed by a host rebuild is reported with the keys the host
      # now offers, rather than as a failed handshake later on.
      - name: Verify host fingerprint
        env:
          FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          keys=$(ssh-keyscan -T 10 -p "${PORT:-22}" -t ecdsa,ed25519,rsa "$HOST" 2>/dev/null | ssh-keygen -lf -) || true
          if [ -z "$keys" ]; then
            echo "::error::could not read the host keys of the deploy host (check DEPLOY_HOST and DEPLOY_PORT)"
            exit 1
          fi
          if ! printf '%s\n' "$keys" | grep -qF -- "$FINGERPRINT"; then
            echo "::error::DEPLOY_HOST_FINGERPRINT matches none of the host's keys, it offers:"
            printf '%s\n' "$keys" | awk '{print $2, $NF}'
            exit 1
          fi
