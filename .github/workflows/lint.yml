name: Lint and build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format check (gofmt + goimports)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' ||
      format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@16517d951552611e7bd358c48ee1051fd0e57b0c # v0.52.0

      - name: Check formatting
        run: |
          gofmt_out=$(gofmt -l .)
          goimports_out=$(goimports -l .)

          if [ -n "$gofmt_out" ] || [ -n "$goimports_out" ]; then
            echo "These files are not formatted:"
            [ -n "$gofmt_out" ] && echo "$gofmt_out" | sed 's/$/ [gofmt]/'
            [ -n "$goimports_out" ] && echo "$goimports_out" | sed 's/$/ [goimports]/'
            exit 1
          fi

  lint-check:
    name: Lint check with golangci-lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' ||
      format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9

  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' ||
      format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build (type-check all packages)
        run: go build ./...

  migration-validation:
    name: Validate migrations
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'pull_request' ||
      format('{0}', github.event.pull_request.user.id) != vars.RENOVATE_BOT_ID
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: goose validate
        run: go tool goose validate -dir internal/storage/migrations
