<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Arbiterer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        background: #0e1418;
        color: #eef1f3;
      }

      main {
        max-width: 420px;
      }

      a {
        color: #6cc4cc;
      }
    </style>
  </head>
  <body>
    <main>
      {{- if .Error}}
      <h1>That didn't work</h1>
      <p>{{.Error}}</p>
      {{- if .PRURL}}
      <p><a href="{{.PRURL}}">Back to the pull request</a></p>
      {{- end}}
      {{- else}}
      <noscript>
        <p>Enable JavaScript to confirm, then open the link again.</p>
        <p><a href="{{.PRURL}}">Back to the pull request</a></p>
      </noscript>
      <form
        id="form"
        method="post"
        action="{{.PostURL}}"
        data-message="
          {{- if eq .Action "delete" -}}
            {{"Delete your data?\n\nThis removes your Discord links in every repository and the Discord tokens Arbiterer stored for you."}}
          {{- else -}}
            {{printf "Unlink your Discord account?\n\nThis removes your Discord link for %s. Its checks will ask you to link again." .Repo}}
          {{- end -}}
        "
        data-pr-url="{{.PRURL}}"
        hidden
      >
        <input type="hidden" name="token" value="{{.Token}}">
      </form>
      <script>
        const form = document.getElementById("form");
        const { message, prUrl } = form.dataset;

        if (confirm(message)) {
          form.submit();
        } else {
          location.replace(prUrl);
        }
      </script>
      {{- end}}
    </main>
  </body>
</html>
